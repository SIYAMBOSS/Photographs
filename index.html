<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Siyam Boss Photo Hub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Canvas Background Animation -->
    <canvas id="nano-canvas"></canvas>

    <div class="relative-zone">
        <!-- LOGIN SECTION -->
        <div id="login-sec" class="login-wrapper">
            <div class="nano-card">
                <h2 class="welcome-title">Welcome To Siyam Boss Photo Hub</h2>
                <form id="login-form">
                    <div class="input-group">
                        <label>Email</label>
                        <input type="email" id="email" placeholder="Enter your email" required>
                    </div>
                    <div class="input-group">
                        <label>Password</label>
                        <input type="password" id="password" placeholder="••••••••" required>
                    </div>
                    <button type="submit" class="btn-nano">AUTHENTICATE</button>
                </form>
            </div>
        </div>

        <!-- MAIN DASHBOARD -->
        <div id="dashboard-sec" class="dashboard hidden">
            <header>
                <div>
                    <h1 class="nav-title">Siyam Boss Photo Hub</h1>
                    <p class="sub-text" id="repo-status">Connected: Repo-1</p>
                </div>

                <!-- Storage Meter -->
                <div class="storage-widget">
                    <div class="storage-info">
                        <span>Repo Usage</span>
                        <span id="storage-txt">0 MB / 1024 MB</span>
                    </div>
                    <div class="meter-bar"><div id="meter-fill" class="meter-fill"></div></div>
                </div>

                <div class="header-actions">
                    <button id="logout-btn" class="btn-logout">Logout</button>
                </div>
            </header>

            <!-- Filter Controls -->
            <div class="controls">
                <div class="search-box input-group">
                    <input type="text" id="search-input" placeholder="Search by tag...">
                </div>

                <div class="view-toggle">
                    <button class="view-btn active" onclick="switchTab('all')">All</button>
                    <button class="view-btn" onclick="switchTab('favs')">Favorites ♥</button>
                </div>

                <div class="view-toggle">
                    <button class="view-btn active" id="btn-grid" onclick="setLayout('grid')">Grid</button>
                    <button class="view-btn" id="btn-masonry" onclick="setLayout('masonry')">Masonry</button>
                </div>
            </div>

            <!-- Gallery Engine -->
            <div id="gallery" class="gallery-grid"></div>

            <!-- Floating Upload (+) Button -->
            <label for="file-input" class="fab-upload-btn" title="Upload Photos">+</label>
            <input type="file" id="file-input" multiple accept="image/*" class="hidden">
        </div>
    </div>

    <!-- Lightbox Modal -->
    <div id="lightbox" class="lightbox hidden" onclick="closeLightbox()">
        <img id="lightbox-img" src="">
    </div>

    <!-- Security/Input Modal -->
    <div id="modal-sec" class="modal hidden">
        <div class="nano-card">
            <h3 id="modal-title" class="modal-title">Security Check</h3>
            <p id="modal-desc" class="modal-desc"></p>
            <div class="input-group">
                <input type="password" id="modal-input" placeholder="Enter Value">
            </div>
            <div class="input-group hidden" id="tag-input-group">
                <label>Add Tag (Optional)</label>
                <input type="text" id="modal-tag" placeholder="e.g., Travel, Secret">
            </div>
            <button id="modal-submit" class="btn-nano">CONFIRM</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
